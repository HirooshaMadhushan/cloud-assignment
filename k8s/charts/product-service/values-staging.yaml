namespace: cloudmart-staging

replicaCount: 1

image:
  repository: 143629080002.dkr.ecr.us-east-1.amazonaws.com/staging/cloudmart/product-service
  tag: latest

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "200m"
    memory: "256Mi"

config:
  dynamodbTableName: cloudmart-products-staging
  awsRegion: us-east-1
  storeBackend: dynamodb

seed:
  enabled: true

serviceAccount:
  irsaRoleArn: "arn:aws:iam::143629080002:role/cloudmart-product-service-role-staging"

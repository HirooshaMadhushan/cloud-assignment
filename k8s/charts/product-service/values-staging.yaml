namespace: cloudmart-staging

replicaCount: 2

image:
  tag: latest

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "200m"
    memory: "256Mi"

config:
  dynamodbTableName: cloudmart-products-staging
  awsRegion: us-east-1

serviceAccount:
  irsaRoleArn: "arn:aws:iam::<AWS_ACCOUNT_ID>:role/cloudmart-product-service-role-staging"

namespace: cloudmart-prod

replicaCount: 2

image:
  repository: 143629080002.dkr.ecr.us-east-1.amazonaws.com/prod/cloudmart/product-service
  tag: latest

resources:
  requests:
    cpu: "200m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

config:
  dynamodbTableName: cloudmart-products-prod
  awsRegion: us-east-1
  storeBackend: dynamodb

seed:
  enabled: false

serviceAccount:
  irsaRoleArn: "arn:aws:iam::143629080002:role/cloudmart-product-service-role-prod"

rollout:
  enabled: false

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-config
  namespace: {{ .Values.namespace }}
data:
  sqsQueueUrl: {{ .Values.config.sqsQueueUrl | quote }}
  awsRegion: {{ .Values.config.awsRegion }}
  queueBackend: {{ .Values.config.queueBackend }}
  emailBackend: {{ .Values.config.emailBackend }}
  fromEmail: {{ .Values.config.fromEmail }}


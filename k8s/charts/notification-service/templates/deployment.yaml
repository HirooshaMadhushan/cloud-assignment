apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: {{ .Values.namespace }}
  labels:
    app: notification-service
    project: cloudmart
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: notification-service
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      serviceAccountName: notification-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: notification-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: AWS_XRAY_DAEMON_ADDRESS
              value: "xray-service.xray:2000"
            - name: QUEUE_BACKEND
              valueFrom:
                configMapKeyRef:
                  name: notification-service-config
                  key: queueBackend
            - name: EMAIL_BACKEND
              valueFrom:
                configMapKeyRef:
                  name: notification-service-config
                  key: emailBackend
            - name: FROM_EMAIL
              valueFrom:
                configMapKeyRef:
                  name: notification-service-config
                  key: fromEmail
            - name: SQS_QUEUE_URL
              valueFrom:
                configMapKeyRef:
                  name: notification-service-config
                  key: sqsQueueUrl
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: notification-service-config
                  key: awsRegion
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 8004
            initialDelaySeconds: 15
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

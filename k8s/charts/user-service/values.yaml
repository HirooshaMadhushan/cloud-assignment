image:
  repository: <AWS_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/cloudmart-staging/user-service
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 2

service:
  type: ClusterIP
  port: 8003

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

hpa:
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 60

config:
  awsRegion: us-east-1
  dbBackend: postgres
  dbHost: "cloudmart-postgres-staging.cm30s6swwvvj.us-east-1.rds.amazonaws.com"
  dbPort: "5432"
  dbUser: "cloudmart_user"
  dbName: "cloudmart"
  jwtSecret: "cloudmart-secret-key-placeholder"

serviceAccount:
  irsaRoleArn: ""   # Override in values-prod.yaml

namespace: cloudmart-prod

namespace: cloudmart-staging

replicaCount: 1

image:
  repository: <AWS_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/cloudmart/user-service
  tag: latest

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "200m"
    memory: "256Mi"

config:
  awsRegion: us-east-1
  dbBackend: postgres
  dbHost: "cloudmart-postgres-staging.cm30s6swwvvj.us-east-1.rds.amazonaws.com"
  dbPort: "5432"
  dbUser: "cloudmart_user"
  dbName: "cloudmart"
  jwtSecret: "staging-secret-key"

serviceAccount:
  irsaRoleArn: "arn:aws:iam::<AWS_ACCOUNT_ID>:role/cloudmart-user-service-role-staging"

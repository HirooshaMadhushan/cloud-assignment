image:
  repository: 143629080002.dkr.ecr.us-east-1.amazonaws.com/cloudmart-staging/frontend
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 2

service:
  type: NodePort
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

hpa:
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

namespace: cloudmart-prod

ingress:
  certificateArn: "" # Set in values-prod.yaml
  wafAclArn: "" # Set in values-prod.yaml
